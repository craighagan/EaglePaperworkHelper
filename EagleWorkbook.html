<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src https://scoutly.scouting.org; form-action 'none'; base-uri 'none'">
<title>Classic Eagle Project Workbook: official order and wording</title>
<meta name="description" content="Fill out your Eagle Scout service project workbook in the official order with the official wording. Saves a backup file, then fills the official PDF. Free.">
<meta property="og:type" content="website">
<meta property="og:title" content="Classic Eagle Project Workbook: official order and wording">
<meta property="og:description" content="Fill out your Eagle Scout service project workbook in the official order with the official wording. Saves a backup file, then fills the official PDF. Free.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Georgia,'Times New Roman',serif;background:#f5f5f0;color:#1a1a1a;line-height:1.5}
.app{max-width:820px;margin:0 auto}
a{color:#00509e}
:focus-visible{outline:3px solid #0066b8;outline-offset:2px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:0;z-index:10;background:#003f87;color:#fff;padding:14px 20px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header h1{font-size:18px;font-weight:700}
header .subtitle{color:#d6e7fa;font-size:12.5px}
.save-status{float:right;font-size:12px;color:#fff;margin-top:3px}
nav{position:sticky;z-index:9;background:#fff;border-bottom:2px solid #003f87;display:flex;overflow-x:auto}
nav button{flex-shrink:0;padding:10px 16px;border:none;background:none;font:600 13px Georgia,serif;cursor:pointer;border-bottom:3px solid transparent;color:#4a4a4a}
nav button.active{color:#003f87;border-bottom-color:#003f87}
nav button:hover{color:#003f87}
main{padding:16px}
.intro{font-size:14px;color:#333;background:#fffbea;border-left:4px solid #c9a227;padding:8px 12px;margin-bottom:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sec-title{font-size:16px;font-weight:700;color:#a50e22;border-bottom:1px solid #f0d0d0;padding-bottom:6px;margin-bottom:10px}
.help{font-size:12.5px;color:#4e5a66;margin:2px 0 6px}
.field{margin-top:10px}
label{display:block;font-size:13px;font-weight:700;color:#333;margin-bottom:3px}
.official-label{display:block;color:#4e5a66;font-size:11.5px;font-weight:400}
input,textarea{width:100%;padding:8px 10px;border:1px solid #b8b8b8;border-radius:4px;font:15px/1.4 Georgia,serif;background:#f0f4fa;color:#1a1a1a}
input::placeholder,textarea::placeholder{color:#5f6b7a;opacity:1}
input:focus,textarea:focus{outline:none;border-color:#003f87;background:#fff;box-shadow:0 0 0 2px rgba(0,63,135,.2)}
textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.table-wrap{overflow-x:auto;margin:8px 0}
table{width:100%;min-width:600px;border-collapse:collapse;font-size:13px}
th{background:#003f87;color:#fff;padding:6px 8px;text-align:left;font-weight:600}
tbody th{background:#eef2f7;color:#1a1a1a;font-weight:600;min-width:180px}
td{padding:2px 3px}
td input{padding:5px 6px;font-size:13px;border-color:#ccc}
.list-total{font-weight:700;color:#003f87;font-size:14px;margin-top:6px}
.phase-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.phase-num{font-size:12px;font-weight:700;color:#555;width:22px;text-align:right;flex-shrink:0}
.phase-row input{flex:1}
.phase-row input.phase-date{flex:0 0 140px}
.nav-btns{display:flex;justify-content:space-between;gap:10px;padding:8px 0}
.btn{display:inline-block;padding:10px 20px;border:none;border-radius:6px;font:600 14px Georgia,serif;cursor:pointer;text-decoration:none}
.btn-prev{background:#e0e0e0;color:#333}
.btn-next{background:#003f87;color:#fff}
.btn:disabled{opacity:.35;cursor:default}
.workbook-controls{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:16px 0}
.workbook-controls.top{margin:0;border-radius:0;border-width:0 0 1px}
.control-buttons{display:flex;flex-wrap:wrap;gap:8px}
.btn-control{display:inline-block;padding:8px 14px;border:1px solid #003f87;border-radius:6px;background:#fff;color:#003f87;font:600 13px Georgia,serif;cursor:pointer;text-decoration:none}
.btn-control:hover{background:#eef2f7}
.btn-control.fill{background:#2d6a30;border-color:#2d6a30;color:#fff}
.btn-control.fill.quiet{background:#fff;color:#2d6a30}
.backup-status{margin-top:6px;font-size:12.5px;color:#4e5a66}
.backup-status.stale{color:#7a4a00;font-weight:700}
.page-footer{margin:24px 0 8px;padding-top:12px;border-top:1px solid #ccc;font-size:12.5px;color:#4e5a66}
.page-footer p{margin:4px 0}
.link-button{border:0;background:none;color:#00509e;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
.loading{padding:40px 20px}
.print-only-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;background:#fffbea;border-bottom:1px solid #c9a227;position:sticky;top:0;z-index:5}
.print-header{text-align:center;padding:16px;border-bottom:2px solid #003f87}
.print-header h1{font-size:22px;color:#003f87}
.draft-mark{display:inline-block;border:2px solid #a50e22;color:#a50e22;font-weight:800;letter-spacing:.04em;padding:2px 10px;margin-bottom:6px}
.print-section-title{font-size:20px;color:#003f87;margin:16px 0 8px}
.print-value{white-space:pre-wrap;border-bottom:1px solid #ccc;min-height:1.4em;padding:2px 0 4px;font-size:14px}
.print-list{padding-left:22px;font-size:14px}
.print-footer{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr}main{padding:12px}.phase-row{flex-wrap:wrap}.phase-row input{flex:1 1 100%}.phase-row input.phase-date{flex:1 1 45%}}
@media print{
  header,nav,.nav-btns,.workbook-controls,.page-footer,.print-only-bar,.help,.intro,.official-label{display:none!important}
  body{background:#fff;font-size:10.5pt}
  .app{max-width:100%}
  main{padding:0}
  .card{box-shadow:none;border:1px solid #bbb;page-break-inside:avoid;padding:10px;margin-bottom:8px}
  th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .table-wrap{overflow:visible}table{min-width:0}
  .print-footer{display:block;position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:8.5pt;color:#555;border-top:1px solid #999;padding-top:2px;background:#fff}
}

/* Tips ("?" buttons), backup help, and checklists */
.label-row{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:0 8px}
.label-row label{flex:1 1 12rem}
.tip-btn{display:inline-flex;align-items:center;gap:5px;min-height:44px;margin:-10px -6px -8px 0;padding:0 8px;border:0;background:none;color:#00509e;font-family:inherit;font-weight:600;font-size:13px;line-height:1;cursor:pointer}
.tip-btn:hover .tip-q{background:#e6f1fc}
.tip-q{display:inline-grid;place-items:center;width:22px;height:22px;border:2px solid currentColor;border-radius:50%;font-size:13px;font-weight:700;line-height:1}
.tip-btn[aria-expanded="true"] .tip-q{background:#00509e;color:#fff;border-color:#00509e}
.tip-line{display:flex;justify-content:flex-end}.tip-line .tip-btn{margin:-6px -6px -6px 0}
.tip{background:#f2f7fc;border-left:4px solid #0066b8;border-radius:6px;padding:8px 12px;margin:4px 0 8px;font-size:14px}
.tip p{margin:4px 0}
.tip-avoid strong{color:#7a4a00}
.tip-meta{font-size:12px;color:#46566a}
.keep-safe,.keep-list{background:#fff;border:1px solid #d3dce6;border-radius:10px;margin:16px 0;padding:0 14px}
.keep-safe summary,.keep-list summary{cursor:pointer;padding:12px 0;font-weight:700;color:#003f87}
.keep-safe-body,.keep-list ul,.keep-list .keep-note{padding-bottom:10px;font-size:14px}
.keep-safe-body p{margin:6px 0}.keep-safe ol,.keep-list ul{padding-left:22px}.keep-safe li,.keep-list li{margin:5px 0}
.keep-safe-note,.keep-note{font-size:13px;color:#46566a}
.keep-list{margin:0 0 14px}
@media(max-width:620px){.btn-control,nav button,.btn-add,.btn,.link-button{min-height:44px}.btn-control{padding-top:10px;padding-bottom:10px}}
@media(forced-colors:active){.tip-q{border-color:ButtonText}.tip{border:1px solid CanvasText}}
.privacy-warning{margin:0 0 16px;padding:12px 14px;background:#fff1f1;border:1px solid #e3a3a3;border-left:5px solid #9a0a1e;border-radius:8px;font-size:14px}
.attachments .steps{margin:4px 0 0 20px;font-size:14px}
.attachments .row-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px}
.attachments .file-pick{position:relative;display:inline-flex;align-items:center;min-height:44px}
.attachments .file-pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.attachments .file-pick:focus-within{outline:3px solid #0066b8;outline-offset:2px}
.attachments .file-pick.disabled{opacity:.5;pointer-events:none}
.thumbs{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.thumb{margin:0;text-align:center;font-size:12px;color:#46566a}
.thumb img{display:block;max-width:120px;max-height:155px;border:1px solid #b9cbdc;background:#fff}
.thumb-open{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:2px}
.thumb-open:hover img{border-color:#003f87;box-shadow:0 0 0 2px #cfe2f7}
.picture-viewer{margin:auto;padding:0;border:0;border-radius:10px;max-width:min(96vw,1000px);max-height:96vh;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.picture-viewer::backdrop{background:rgba(10,20,35,.7)}
.picture-viewer .viewer-bar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:#fff;border-bottom:1px solid #dce5ef;font-weight:600;font-size:14px}
.picture-viewer img{display:block;max-width:100%;max-height:calc(96vh - 60px);margin:0 auto;object-fit:contain}
.thumb-missing{width:110px;height:140px;display:flex;align-items:center;justify-content:center;padding:6px;border:1px dashed #9a0a1e;color:#9a0a1e;font-size:12px}
.attachment{padding:10px 0;border-top:1px solid #e3ebf3}
.attachment label.mini{display:grid;gap:4px;font-weight:600;font-size:14px}
.link-row{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;align-items:center;margin:8px 0}
.link-row .warn{grid-column:1/-1;color:#9a0a1e;margin:0}
.attach-status{margin:12px 0;font-size:14px;color:#46566a}
.attachments .more-help{margin-top:8px}.attachments .more-help summary{cursor:pointer;font-weight:600;font-size:14px;color:#33495f}
.attachments button:disabled{opacity:.5;cursor:not-allowed}
.card-status{margin:8px 0 0;font-size:14px;font-weight:600;color:#155c36}
.card-status.error{color:#9a0a1e}
@media(max-width:560px){.link-row{grid-template-columns:1fr}}
.ask-help{margin:0 0 14px;border:1px solid #c9d3e0;border-radius:8px;background:#f5f8fc;padding:8px 12px;font-size:.95em}.ask-help summary{cursor:pointer;font-weight:600}.ask-help ul{margin:6px 0 2px;padding-left:20px}.ask-help p{margin:6px 0}
.ask-scoutly{margin-top:10px}.scoutly-win{position:fixed;right:16px;bottom:16px;z-index:50;width:380px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:2px solid #003f87;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.3)}.scoutly-bar{display:flex;gap:6px;align-items:flex-start;padding:6px 8px 6px 10px;background:#003f87;color:#fff;font-size:12.5px;line-height:1.3}.scoutly-bar span{flex:1}.scoutly-btn{flex:none;min-width:32px;min-height:32px;border:0;border-radius:6px;background:rgba(255,255,255,.18);color:#fff;font-size:18px;line-height:1;cursor:pointer}.scoutly-frame{display:block;flex:1;width:100%;min-height:0;border:0}.scoutly-note{margin:0;padding:5px 10px;font-size:12px}.scoutly-pill{position:fixed;right:16px;bottom:16px;z-index:50;padding:10px 16px;border:0;border-radius:999px;background:#003f87;color:#fff;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}@media(max-width:620px){.scoutly-win{right:8px;left:8px;bottom:8px;width:auto;max-width:none;height:75vh}body.scoutly-open{padding-bottom:75vh}}
@media print{input::placeholder,textarea::placeholder{color:transparent}.tip,.tip-btn,.tip-wrap,.keep-safe,.keep-list,.ask-help,.scoutly-win,.scoutly-pill{display:none!important}}
</style>
</head>
